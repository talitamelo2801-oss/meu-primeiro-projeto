<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Solidária - Cadastro</title>
</head>
<body>

    <header>
        <h1>Mesa Solidária</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos Sociais</a></li>
                <li><a href="cadastro.html">Seja Voluntário</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Cadastro de Voluntários e Doadores</h2>

        <form>
            <fieldset>
                <legend><strong>Informações Pessoais</strong></legend>
                
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required><br><br>
                
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required><br><br>

                <!-- Telefone Celular -->
                <label for="telefone">Telefone / WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000" title="Formato: (00) 00000-0000" required><br><br>

                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento"><br><br>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" title="Formato: 000.000.000-00"><br>
            </fieldset>

            <br>

            <fieldset>
                <legend><strong>Endereço de Residência</strong></legend>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required><br><br>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000"><br>
            </fieldset>

            <br>

            <fieldset>
                <legend><strong>Área de Atuação</strong></legend>

                <label for="atuacao">Como deseja ajudar?</label><br>
                <input type="radio" id="voluntario" name="atuacao" value="voluntario">
                <label for="voluntario">Quero ser Voluntário</label><br>

                <input type="radio" id="doador" name="atuacao" value="doador">
                <label for="doador">Quero fazer Doações</label><br>
            </fieldset>

            <br>
            <button type="submit">Enviar Cadastro</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mesa Solidária - Todos os direitos reservados.</p>
    </footer>
<script src="js/main.js"></script>
</body>
</html>
